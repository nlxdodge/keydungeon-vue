services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    image: keydungeon-vue:latest
    container_name: keydungeon-vue
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - global
    labels:
      - "traefik.http.routers.keydungeon.rule=Host(`key.gerbenveenhof.nl`) && !PathPrefix(/api)"
      - "traefik.http.services.keydungeon.loadbalancer.server.port=8080"
      - "traefik.http.routers.keydungeon.tls.certresolver=letsencrypt"
      - "traefik.http.routers.keydungeon.entrypoints=websecure"
      - "traefik.docker.network=global"
      - "traefik.enable=true"

networks:
  default:
    name: global
    external: true
